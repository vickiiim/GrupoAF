<div style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; font-family: sans-serif;">
  <h2>Iniciar Sesión - Clínica Médica</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div style="margin-bottom: 15px;">
      <label for="email" style="display: block; margin-bottom: 5px;">Correo Electrónico:</label>
      <input id="email" type="email" formControlName="email" placeholder="admin@clinica.com" style="width: 100%; padding: 8px; box-sizing: border-box;" />
      <div style="color: red; font-size: 12px; margin-top: 4px;" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required']">
        El correo es obligatorio.
      </div>
      <div style="color: red; font-size: 12px; margin-top: 4px;" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['email']">
        Formato de correo inválido.
      </div>
    </div>

    <div style="margin-bottom: 15px;">
      <label for="clave" style="display: block; margin-bottom: 5px;">Contraseña:</label>
      <input id="clave" type="password" formControlName="clave" placeholder="••••••••" style="width: 100%; padding: 8px; box-sizing: border-box;" />
      <div style="color: red; font-size: 12px; margin-top: 4px;" *ngIf="loginForm.get('clave')?.touched && loginForm.get('clave')?.errors?.['required']">
        La contraseña es obligatoria.
      </div>
    </div>

    <div style="background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; margin-bottom: 15px;" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <button type="submit" [disabled]="loading" style="width: 100%; padding: 10px; background-color: #0d6efd; color: white; border: none; border-radius: 4px; cursor: pointer;">
      {{ loading ? 'Ingresando...' : 'Iniciar Sesión' }}
    </button>
  </form>
</div>
