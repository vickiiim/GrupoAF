# =============================================================================
# Variante de clinica.conf para la DEMO LOCAL con Nginx en Docker.
# -----------------------------------------------------------------------------
# Se usa cuando el backend corre en Windows con PM2 y Nginx corre en un
# contenedor. En ese caso, "127.0.0.1" dentro del contenedor es el propio
# contenedor, por eso el proxy apunta a "host.docker.internal:3000".
#
# NO usar este archivo en el servidor Linux de produccion: ahi corresponde
# deploy/nginx/clinica.conf (proxy a 127.0.0.1:3000).
#
# Uso (desde la raiz del repositorio, con el backend ya compilado y en PM2):
#   docker run -d --name nginx-prod -p 80:80 ^
#     -v "%CD%/frontend/dist/frontend/browser:/usr/share/nginx/html:ro" ^
#     -v "%CD%/deploy/nginx/clinica.docker.conf:/etc/nginx/conf.d/default.conf:ro" ^
#     nginx:alpine
#
# La carpeta de Angular se monta en /usr/share/nginx/html, que es el "root"
# configurado abajo.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/clinica.access.log;
    error_log  /var/log/nginx/clinica.error.log;

    # --- Compresion de respuestas estaticas -----------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss text/xml image/svg+xml font/woff font/woff2;

    # --- API REST (NestJS) -----------------------------------------------------
    # ^~ evita que /api/docs/swagger-ui.css caiga en el location de estaticos.
    location ^~ /api/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --- Archivos estaticos generados por Angular (nombre con hash) ------------
    location ~* \.(?:css|js|mjs|woff2?|eot|ttf|otf|svg|png|jpe?g|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Fallback de la SPA (Angular Router) -----------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- index.html sin cache --------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
