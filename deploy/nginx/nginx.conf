# =============================================================================
# nginx.conf completo para servir la SPA de Angular + API NestJS
# (TFI 2026 - Grupo AF)
#
# Uso en Ubuntu/Debian:
#   sudo cp deploy/nginx/nginx.conf /etc/nginx/nginx.conf
#   sudo cp deploy/nginx/clinica.conf /etc/nginx/sites-available/clinica
#   sudo ln -s /etc/nginx/sites-available/clinica /etc/nginx/sites-enabled/clinica
#   sudo nginx -t && sudo systemctl restart nginx
#
# Uso con Docker (montando el proyecto en /var/www):
#   nginx -c /var/www/GrupoAF-main/deploy/nginx/nginx.conf
# =============================================================================

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Sitio de la aplicacion (archivos estaticos + proxy /api -> NestJS)
    include /etc/nginx/sites-enabled/*;
}
