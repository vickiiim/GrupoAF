# =============================================================================
# Sitio "Clinica Medica - TFI 2026 Grupo AF"
# -----------------------------------------------------------------------------
#  /            -> archivos estaticos de Angular (frontend/dist/frontend/browser)
#  /api/        -> proxy_pass al backend NestJS (http://127.0.0.1:3000)
#  /api/docs    -> Swagger UI ( tambien resuelto a traves del proxy /api/)
#
# Instalacion en Ubuntu/Debian:
#   sudo cp deploy/nginx/clinica.conf /etc/nginx/sites-available/clinica
#   sudo ln -s /etc/nginx/sites-available/clinica /etc/nginx/sites-enabled/clinica
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost clinica.local;

    # Ajustar esta ruta a donde se clone el repositorio en el servidor.
    # Por ejemplo: /home/usuario/GrupoAF-main/frontend/dist/frontend/browser
    root /var/www/GrupoAF-main/frontend/dist/frontend/browser;
    index index.html;

    access_log /var/log/nginx/clinica.access.log;
    error_log  /var/log/nginx/clinica.error.log;

    # --- Compression de respuestas estaticas -----------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss text/xml image/svg+xml font/woff font/woff2;

    # --- API REST (NestJS) -----------------------------------------------------
    # proxy_pass sin ruta final conserva el prefijo /api en la peticion,
    # que es exactamente lo que espera NestJS (setGlobalPrefix('api')).
    #
    # El prefijo ^~ es importante: hace que TODA ruta /api/... se derive al
    # backend antes de evaluar las expresiones regulares de archivos estaticos.
    # Sin ^~, /api/docs/swagger-ui.css caeria en el location de imagenes/css y
    # devolveria 404, rompiendo la interfaz de Swagger detras de Nginx.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --- Archivos estaticos generados por Angular (nombre con hash) ------------
    location ~* \.(?:css|js|mjs|woff2?|eot|ttf|otf|svg|png|jpe?g|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Fallback de la SPA (Angular Router) -----------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Cache de index.html para no cachear la version de la app --------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
